name: TWRP Citrine Preflight

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Check Build Environment
    run: |
      echo "Preparando TWRP para Redmi Note 14 5G"
      echo "Dispositivo: citrine"
      echo "Android de referencia: 16"
      echo "Espacio disponible:"
      df -h
      echo "Version de Git:"
      git --version
      echo "Version de Python:"
      python3 --version
      echo "Verificacion terminada; no se ha compilado ni flasheado nada."
