name: TWRP Citrine - Preflight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Fase 2 Final - Leer Repo B (Lineage 23.2) y Repo C (Kernel)
        run: |
          git clone --depth=1 https://github.com/twrpdtgen/android_device_xiaomi_beryl.git /tmp/repo_a 2>/dev/null
          echo "=== 1. INIT.RECOVERY.MT6855.RC (REPO A) ==="
          grep -vE '^\s*#|^\s*$' /tmp/repo_a/recovery/root/init.recovery.mt6855.rc || true

          git clone --depth=1 -b lineage-23.2-6.12 https://github.com/TracenPlayground/device_xiaomi_beryl.git /tmp/repo_b 2>/dev/null
          cd /tmp/repo_b
          echo ""
          echo "=== 2. BOARDCONFIG.MK (REPO B - LINEAGE 23.2) ==="
          git log -n 1 --oneline
          grep -vE '^\s*#|^\s*$' BoardConfig.mk || true

          echo ""
          echo "=== 3. CONFIGURACION RECOVERY Y VENDOR_BOOT EN DEVICE.MK (REPO B) ==="
          grep -iE "recovery|vendor_boot|fstab|bootctrl|fastboot|mt6855|citrine|beryl" device.mk || true

          echo ""
          echo "=== 4. FSTAB DE ANDROID 16 (CIFRADO Y PARTICIONES EN REPO B) ==="
          find . -name "*fstab*" -exec echo "Archivo: {}" \; -exec grep -E "userdata|metadata|boot|recovery|logical" {} \; || true

          git clone --depth=1 -b lineage-23.2-6.12 https://github.com/TracenPlayground/device_xiaomi_beryl-kernel.git /tmp/repo_c 2>/dev/null
          echo ""
          echo "=== 5. ARCHIVOS Y VERSION EN REPO C (KERNEL) ==="
          cd /tmp/repo_c
          git log -n 2 --oneline
          find . -maxdepth 3 -not -path '*/.*'
