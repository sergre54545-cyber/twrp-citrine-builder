name: TWRP Citrine - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1
          repo sync -j2 --force-sync --no-clone-bundle --no-tags -c

      - name: Import device tree
        run: |
          test -d builder/device/xiaomi/citrine
          mkdir -p device/xiaomi
          cp -r builder/device/xiaomi/citrine device/xiaomi/citrine
          echo "=== AndroidProducts.mk ==="
          cat device/xiaomi/citrine/AndroidProducts.mk
          echo "=== Product makefile ==="
          cat device/xiaomi/citrine/twrp_citrine.mk

      - name: Preparar memoria de intercambio
        shell: bash
        run: |
          set -e
          echo "=== MEMORIA ANTES DEL SWAP ==="
          free -h
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          if ! swapon --show | grep -q '/swapfile'; then
            sudo swapon /swapfile
          fi
          echo "=== MEMORIA DISPONIBLE ==="
          free -h
          swapon --show

      - name: Compilar vendor_boot de Citrine
        shell: bash
        run: |
          set -eo pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh

          echo "=== CONFIGURAR PRODUCTO VALIDADO ==="
          lunch twrp_citrine-ap2a-eng

          echo "=== CONFIRMAR PRODUCTO Y VERSION ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          if [ "$TARGET_PRODUCT" != "twrp_citrine" ] ||
             [ "$TARGET_RELEASE" != "ap2a" ]; then
            echo "ERROR: la configuración no coincide con la validada."
            exit 1
          fi

          echo "=== CONFIGURACION DE VENDOR_BOOT ==="
          grep -nE 'BOARD_BOOT_HEADER_VERSION|BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT|BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE|TARGET_PREBUILT_KERNEL' \
            device/xiaomi/citrine/BoardConfig.mk

          echo "=== COMPILAR vendorbootimage ==="
          mka vendorbootimage -j1

          echo "=== BUSCAR IMAGEN GENERADA ==="
          find out/target/product -type f -name 'vendor_boot.img' -print

          IMAGE="$(find out/target/product -type f -name 'vendor_boot.img' -print -quit)"
          if [ -z "$IMAGE" ] || [ ! -s "$IMAGE" ]; then
            echo "ERROR: no se encontró vendor_boot.img válido."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"

          echo "=== IMAGEN GENERADA ==="
          ls -lh "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"
          sha256sum "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"

      - name: Publicar vendor_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-citrine-vendor-boot
          path: artifacts/vendor_boot.img
          if-no-files-found: error
          retention-days: 7
