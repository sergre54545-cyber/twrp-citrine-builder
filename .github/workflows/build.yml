name: TWRP Citrine - Preflight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "Preparación de TWRP para Redmi Note 14 5G"
          echo "Dispositivo: citrine"
          echo "Android de referencia: 16"
          df -h
          free -h || true
          git --version
          python3 --version
          echo "Esta ejecución solo verifica el entorno."
          echo "No compila ni flashea imágenes."

      - name: Fase 1 y 2 - Inspeccionar fuentes y repositorios
        run: |
          echo "=== 1. ARCHIVOS EN TWRP-CITRINE-BUILDER ==="
          find . -maxdepth 3 -not -path '*/.*'

          echo ""
          echo "=== 2. RAMAS DEL MANIFIESTO OFICIAL DE TWRP ==="
          git ls-remote --heads https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git || true

          echo ""
          echo "=== 3. REPO A: twrpdtgen/android_device_xiaomi_beryl ==="
          git clone --depth=1 https://github.com/twrpdtgen/android_device_xiaomi_beryl.git /tmp/repo_a || true
          if [ -d /tmp/repo_a ]; then
            cd /tmp/repo_a
            git log -n 1 --oneline
            find . -maxdepth 3 -not -path '*/.*'
            echo "--- BoardConfig.mk (Repo A) ---"
            cat BoardConfig.mk || true
            echo "--- recovery.fstab (Repo A) ---"
            find . -name "*fstab*" -exec head -n 120 {} + || true
          fi

          echo ""
          echo "=== 4. REPO B: TracenPlayground/device_xiaomi_beryl ==="
          git clone --depth=1 -b lineage-23.2-6.12 https://github.com/TracenPlayground/device_xiaomi_beryl.git /tmp/repo_b || true
          if [ -d /tmp/repo_b ]; then
            cd /tmp/repo_b
            git log -n 1 --oneline
            find . -maxdepth 3 -not -path '*/.*'
            echo "--- BoardConfig.mk (Repo B) ---"
            cat BoardConfig.mk || true
            echo "--- Archivos fstab (Repo B) ---"
            find . -name "*fstab*" -exec head -n 120 {} + || true
          fi

          echo ""
          echo "=== 5. REPO C: TracenPlayground/device_xiaomi_beryl-kernel ==="
          git ls-remote --heads https://github.com/TracenPlayground/device_xiaomi_beryl-kernel.git || true
