
      - name: Verificar kernel externo
        run: |
          git clone --depth=1 -b lineage-23.2-6.12 https://github.com/TracenPlayground/device_xiaomi_beryl-kernel.git /tmp/repo_c
          echo "=== ARCHIVOS DEL KERNEL ==="
          find /tmp/repo_c -maxdepth 3 -type f \( -name 'Image*' -o -name '*.dtb' -o -name '*.ko' \) | head -80
          echo "=== VERSION DEL KERNEL EN MODULOS ==="
          find /tmp/repo_c -type f -name '*.ko' | head -5 | while read f; do
            echo "--- $f"
            strings "$f" | grep -m 3 'vermagic=' || true
          done
