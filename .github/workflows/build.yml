name: Build Android APK

on:
push:
branches:
- main
- version-limpia
workflow_dispatch:

permissions:
contents: read

jobs:
check:
runs-on: ubuntu-latest
steps:
- name: Check out builder repository
uses: actions/checkout@v4

  - name: Check build environment
    run: |
      echo "Preparacion de TWRP para Redmi Note 14 5G"
      echo "Dispositivo: citrine"
      echo "Android de referencia: 16"
      df -h
      git --version
      python3 --version
      echo "Verificacion completada."
      echo "Este flujo no compila ni flashea imagenes."
