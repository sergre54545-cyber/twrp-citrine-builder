name: TWRP Citrine - Build

on:
push:
branches: [ main ]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout builder repo (contains device tree)
    uses: actions/checkout@v4
    with:
      path: builder

  - name: Free disk space
    run: |
      sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      df -h /

  - name: Set up build environment
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev \
        x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip fontconfig python-is-python3

      mkdir -p "$HOME/bin"
      curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
      chmod a+x "$HOME/bin/repo"
      echo "$HOME/bin" >> "$GITHUB_PATH"

      git config --global user.email "ci@citrine.local"
      git config --global user.name "CI citrine"

  - name: Sync TWRP 14.1 sources
    run: |
      repo init --depth=1 \
        -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
        -b twrp-14.1

      repo sync -j"$(nproc --all)" \
        --force-sync --no-clone-bundle --no-tags -c

  - name: Import device tree (kernel + DTB propios)
    run: |
      test -d builder/device/xiaomi/citrine
      mkdir -p device/xiaomi
      cp -r builder/device/xiaomi/citrine device/xiaomi/citrine

      echo "=== Device tree ==="
      ls -la device/xiaomi/citrine
      echo "=== Prebuilt files ==="
      ls -lh device/xiaomi/citrine/prebuilt/

      echo "=== Product definition ==="
      cat device/xiaomi/citrine/AndroidProducts.mk

  - name: Configure TWRP build
    run: |
      set -e
      source build/envsetup.sh

      echo "=== Available lunch command help ==="
      lunch --help || true

      echo "=== Select Citrine product ==="
      lunch twrp_citrine-trunk_staging-eng

  - name: Build TWRP vendor_boot
    run: |
      set -e
      source build/envsetup.sh
      lunch twrp_citrine-trunk_staging-eng
      mka vendorbootimage

  - name: Check generated image
    if: success()
    run: |
      IMAGE="out/target/product/citrine/vendor_boot.img"

      if [ ! -s "$IMAGE" ]; then
        echo "::error::vendor_boot.img was not generated or is empty."
        exit 1
      fi

      echo "=== Generated image ==="
      ls -lh "$IMAGE"
      sha256sum "$IMAGE"
      file "$IMAGE"

  - name: Upload artifact
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: twrp-citrine-vendor_boot
      path: out/target/product/citrine/vendor_boot.img
      if-no-files-found: warn
