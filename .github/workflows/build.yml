name: TWRP Citrine - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1
          repo sync -j2 --force-sync --no-clone-bundle --no-tags -c

      - name: Import device tree
        run: |
          test -d builder/device/xiaomi/citrine
          mkdir -p device/xiaomi
          cp -r builder/device/xiaomi/citrine device/xiaomi/citrine
          echo "=== AndroidProducts.mk ==="
          cat device/xiaomi/citrine/AndroidProducts.mk
          echo "=== Product makefile ==="
          cat device/xiaomi/citrine/twrp_citrine.mk

      - name: Probar combinaciones lunch
        shell: bash
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh

          echo "=== CONFIGURACIONES DE VERSION DISPONIBLES ==="
          find build/release/build_config -maxdepth 1 -type f -name '*.scl' -printf '%f\n' 2>/dev/null | sort || true

          echo "=== PRODUCTOS REGISTRADOS ==="
          cat device/xiaomi/citrine/AndroidProducts.mk

          releases=("trunk_staging")
          while IFS= read -r file; do
            releases+=("$(basename "$file" .scl)")
          done < <(find build/release/build_config -maxdepth 1 -type f -name '*.scl' 2>/dev/null | sort)

          echo "=== PRUEBAS LUNCH; SIN COMPILAR ==="
          for release in "${releases[@]}"; do
            combo="twrp_citrine-${release}-eng"
            echo
            echo ">>> Probando: $combo"

            if lunch "$combo" > /tmp/citrine-lunch.log 2>&1; then
              cat /tmp/citrine-lunch.log
              echo "LUNCH_OK=$combo"
              echo "TARGET_PRODUCT=${TARGET_PRODUCT:-no definido}"
              echo "TARGET_RELEASE=${TARGET_RELEASE:-no definido}"
              echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-no definido}"
            else
              cat /tmp/citrine-lunch.log
              echo "LUNCH_FALLO=$combo"
            fi
          done

          echo
          echo "=== FIN: no se ejecutó ninguna compilación ==="
