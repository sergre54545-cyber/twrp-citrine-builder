name: Build Android APK

on:
push:
branches:
- main
- version-limpia
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Check Build Environment
    run: |
      echo "Preparando TWRP para Redmi Note 14 5G"
      echo "Dispositivo: citrine"
      echo "Android de referencia: 16"
      df -h
      git --version
      python3 --version
      echo "Verificacion terminada."
