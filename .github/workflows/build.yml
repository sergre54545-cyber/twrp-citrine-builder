name: TWRP Citrine - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1
          repo sync -j2 --force-sync --no-clone-bundle --no-tags -c

      - name: Import device tree
        run: |
          test -d builder/device/xiaomi/citrine
          mkdir -p device/xiaomi
          cp -r builder/device/xiaomi/citrine device/xiaomi/citrine
          echo "=== AndroidProducts.mk ==="
          cat device/xiaomi/citrine/AndroidProducts.mk
          echo "=== Product makefile ==="
          cat device/xiaomi/citrine/twrp_citrine.mk

      - name: Diagnose lunch configuration
        shell: bash
        run: |
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          echo "=== lunch function ==="
          declare -f lunch
          echo "=== Citrine product registration ==="
          grep -Rni "twrp_citrine\|COMMON_LUNCH_CHOICES" device/xiaomi/citrine
          echo "=== Release configuration files ==="
          for dir in build/make/target/release build/release; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 3 -type f -print
            fi
          done
          echo "=== Release configuration references ==="
          grep -RniE 'release_config_map|trunk_staging|ap2a|ap1a' \
            build/make/core build/make/target/release build/release \
            2>/dev/null | head -200 || true
          echo "=== Diagnostic complete; no lunch or build executed ==="
