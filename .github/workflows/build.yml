name: TWRP Citrine - Preflight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "Preparación de TWRP para Redmi Note 14 5G (citrine)"
          df -h
          free -h || true

      - name: Fase 2 Parte 2 - Inspeccionar Repo B y Kernel
        run: |
          git clone --depth=1 https://github.com/twrpdtgen/android_device_xiaomi_beryl.git /tmp/repo_a 2>/dev/null
          echo "=== 1. RECOVERY.FSTAB COMPLETO (REPO A) ==="
          cat /tmp/repo_a/recovery.fstab || true

          echo ""
          echo "=== 2. INIT.RECOVERY.MT6855.RC (REPO A) ==="
          cat /tmp/repo_a/recovery/root/init.recovery.mt6855.rc || true

          git clone --depth=1 -b lineage-23.2-6.12 https://github.com/TracenPlayground/device_xiaomi_beryl.git /tmp/repo_b 2>/dev/null
          echo ""
          echo "=== 3. ARCHIVOS EN REPO B (LINEAGE 23.2) ==="
          cd /tmp/repo_b
          git log -n 1 --oneline
          find . -maxdepth 3 -not -path '*/.*'

          echo ""
          echo "=== 4. BOARDCONFIG.MK (REPO B) ==="
          cat BoardConfig.mk || true

          echo ""
          echo "=== 5. FSTAB Y ARCHIVOS DE RECOVERY EN REPO B ==="
          find . -name "*fstab*" -exec echo "--- {} ---" \; -exec cat {} \; || true
          grep -rn "vendor_boot\|recovery\|HEADER\|AVB" BoardConfig.mk device.mk 2>/dev/null || true

          echo ""
          echo "=== 6. ARCHIVOS EN REPO C (KERNEL) ==="
          curl -s "https://api.github.com/repos/TracenPlayground/device_xiaomi_beryl-kernel/git/trees/lineage-23.2-6.12?recursive=1" | grep '"path":' || true
